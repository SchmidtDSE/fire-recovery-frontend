name: Deploy to Storage

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Static Website to Storage
    runs-on: ubuntu-latest

    # GCS through its S3 endpoint with HMAC keys, via the AWS CLI preinstalled on
    # the runner (as fire-recovery-backend does). The secrets keep their MinIO-era names.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      # GCS rejects the checksum headers AWS CLI >= 2.23 sends by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug endpoints.js file
        run: |
          echo "Current content of endpoints.js:"
          cat src/js/shared/api/endpoints.js

      - name: Set environment variables
        run: |
          echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
          # mc took the endpoint with or without a scheme; the AWS CLI needs one
          endpoint="${{ secrets.MINIO_ENDPOINT }}"
          case "$endpoint" in http://*|https://*) ;; *) endpoint="https://$endpoint" ;; esac
          echo "S3_ENDPOINT_URL=$endpoint" >> $GITHUB_ENV

      - name: Debug storage connection
        run: |
          aws --version
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 ls s3://fire-recovery-web/
          echo "Current content in target bucket"

      - name: Deploy to production bucket
        if: env.BRANCH_NAME == 'main'
        run: |
          echo "Deploying to production bucket with no-cache headers"
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 cp src/ s3://fire-recovery-web/prod/ \
            --recursive --no-progress \
            --cache-control "no-cache, no-store, must-revalidate"
          echo "Verifying deployment..."
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 ls s3://fire-recovery-web/prod/

      - name: Deploy to development bucket
        if: env.BRANCH_NAME == 'dev'
        run: |
          echo "Deploying to development bucket with no-cache headers"
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 cp src/ s3://fire-recovery-web/dev/ \
            --recursive --no-progress \
            --cache-control "no-cache, no-store, must-revalidate"
          echo "Verifying deployment..."
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 ls s3://fire-recovery-web/dev/
